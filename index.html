<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球现代海空战战略沙盘指挥系统</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #030712;
            color: #38bdf8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
        }
        #header {
            background: rgba(3, 7, 18, 0.9);
            border-bottom: 1px solid #1e293b;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #38bdf8;
        }
        #hud {
            background: #0b0f19;
            color: #e2e8f0;
            font-size: 11px;
            padding: 6px 12px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 4px;
        }
        .hud-item { background: #111827; padding: 3px 6px; border-radius: 4px; border: 1px solid #374151; }
        canvas {
            background-color: #050b14;
            display: block;
            margin: 0 auto;
            border-left: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
        }
        #controls {
            background: #030712;
            padding: 8px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid #1e293b;
        }
        button {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #0284c7;
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background: #0284c7; color: #fff; }
    </style>
</head>
<body>

    <div id="header">TACTICAL GLOBAL NAVAL & AIR THEATER v3.5</div>
    <div id="hud">
        <div class="hud-item" id="sel-info">就绪: 选择战术单位</div>
        <div class="hud-item" id="blue-score">蓝方战力: 100%</div>
        <div class="hud-item" id="red-score">红方战力: 100%</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <button onclick="setOrder('move')">航向/机动</button>
        <button onclick="setOrder('asm')">反舰打击</button>
        <button onclick="setOrder('aam')">防空拦截</button>
        <button onclick="launchAirStrike()">起飞舰载机</button>
        <button onclick="toggleAudio()" id="audio-btn">声音: 关</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 自适应手机屏幕尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 130;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 音效引擎 (Web Audio API 无需外部音频文件)
        let audioCtx = null;
        let soundEnabled = false;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function toggleAudio() {
            initAudio();
            soundEnabled = !soundEnabled;
            document.getElementById("audio-btn").innerText = "声音: " + (soundEnabled ? "开" : "关");
        }
        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'launch') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.0, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        // 全球现代战舰与兵力定义
        let units = [
            // 蓝军 (Blue Force)
            { id: 1, name: "尼米兹级航母", team: "blue", type: "CVN", x: 150, y: 200, hp: 300, maxHp: 300, missiles: 24, fuel: 100, range: 400, targetX: 150, targetY: 200, target: null },
            { id: 2, name: "福特级航母", team: "blue", type: "CVN", x: 120, y: 380, hp: 350, maxHp: 350, missiles: 30, fuel: 100, range: 450, targetX: 120, targetY: 380, target: null },
            { id: 3, name: "阿利·伯克级驱逐舰", team: "blue", type: "DDG", x: 220, y: 280, hp: 150, maxHp: 150, missiles: 48, fuel: 100, range: 300, targetX: 220, targetY: 280, target: null },
            { id: 4, name: "弗吉尼亚级核潜艇", team: "blue", type: "SSN", x: 180, y: 500, hp: 120, maxHp: 120, missiles: 20, fuel: 100, range: 250, targetX: 180, targetY: 500, target: null },

            // 红军 (Red Force)
            { id: 5, name: "福建舰航母", team: "red", type: "CVN", x: canvas.width - 150, y: 200, hp: 320, maxHp: 320, missiles: 28, fuel: 100, range: 420, targetX: canvas.width - 150, targetY: 200, target: null },
            { id: 6, name: "库兹涅佐夫级航母", team: "red", type: "CVN", x: canvas.width - 120, y: 400, hp: 280, maxHp: 280, missiles: 22, fuel: 100, range: 380, targetX: canvas.width - 120, targetY: 400, target: null },
            { id: 7, name: "055型万吨大驱", team: "red", type: "DDG", x: canvas.width - 250, y: 300, hp: 180, maxHp: 180, missiles: 64, fuel: 100, range: 350, targetX: canvas.width - 250, targetY: 300, target: null },
            { id: 8, name: "基洛级常规潜艇", team: "red", type: "SSN", x: canvas.width - 200, y: 520, hp: 100, maxHp: 100, missiles: 18, fuel: 100, range: 220, targetX: canvas.width - 200, targetY: 520, target: null }
        ];

        let missiles = [];
        let aircraft = [];
        let explosions = [];
        let selectedUnit = units[0];
        let currentOrder = 'move';

        function setOrder(order) {
            playSound('click');
            currentOrder = order;
            let hints = { 'move': '【机动模式】点击海图移动所选单位', 'asm': '【反舰打击】点击敌方舰艇发射导弹', 'aam': '【防空拦截】进入警戒防御态势' };
            document.getElementById("sel-info").innerText = hints[order];
        }

        // 触控交互
        canvas.addEventListener("pointerdown", function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 检查点击了哪个单位
            let clicked = null;
            for (let u of units) {
                if (u.hp > 0 && Math.hypot(u.x - x, u.y - y) < 25) {
                    clicked = u;
                    break;
                }
            }

            if (clicked) {
                playSound('click');
                if (clicked.team === 'blue') {
                    selectedUnit = clicked;
                    document.getElementById("sel-info").innerText = `已选择: ${selectedUnit.name} [${selectedUnit.type}] HP:${selectedUnit.hp}`;
                } else if (selectedUnit && selectedUnit.team === 'blue' && currentOrder === 'asm') {
                    // 发射反舰导弹
                    if (selectedUnit.missiles > 0) {
                        missiles.push({
                            x: selectedUnit.x, y: selectedUnit.y,
                            targetX: clicked.x, targetY: clicked.y,
                            target: clicked, team: 'blue', type: 'ASM', speed: 4, damage: 45
                        });
                        selectedUnit.missiles--;
                        playSound('launch');
                        document.getElementById("sel-info").innerText = `发射反舰导弹打击 ${clicked.name}！`;
                    } else {
                        document.getElementById("sel-info").innerText = `${selectedUnit.name} 导弹已耗尽！`;
                    }
                }
            } else if (selectedUnit && selectedUnit.team === 'blue') {
                if (currentOrder === 'move') {
                    selectedUnit.targetX = x;
                    selectedUnit.targetY = y;
                    document.getElementById("sel-info").innerText = `${selectedUnit.name} 正在调整航向...`;
                }
            }
        });

        // 起飞舰载机编队
        function launchAirStrike() {
            if (!selectedUnit || selectedUnit.type !== 'CVN' || selectedUnit.team !== 'blue') {
                document.getElementById("sel-info").innerText = "错误：必须选择己方航空母舰才能起飞战机！";
                return;
            }
            playSound('launch');
            aircraft.push({
                x: selectedUnit.x, y: selectedUnit.y,
                targetX: selectedUnit.x + 200, targetY: selectedUnit.y - 100,
                team: 'blue', type: 'F-35C / 歼-35', fuel: 200, hp: 50
            });
            document.getElementById("sel-info").innerText = "舰载机编队已成功弹射起飞执行空中巡逻！";
        }

        // 简易红方AI逻辑
        function runAI() {
            for (let u of units) {
                if (u.team === 'red' && u.hp > 0) {
                    // 随机反击蓝军
                    if (Math.random() < 0.015 && u.missiles > 0) {
                        let activeBlues = units.filter(b => b.team === 'blue' && b.hp > 0);
                        if (activeBlues.length > 0) {
                            let target = activeBlues[Math.floor(Math.random() * activeBlues.length)];
                            missiles.push({
                                x: u.x, y: u.y,
                                targetX: target.x, targetY: target.y,
                                target: target, team: 'red', type: 'ASM', speed: 3.5, damage: 40
                            });
                            u.missiles--;
                        }
                    }
                }
            }
        }

        // 游戏逻辑更新
        function update() {
            // 单位移动
            for (let u of units) {
                if (u.hp <= 0) continue;
                let dx = u.targetX - u.x;
                let dy = u.targetY - u.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 2) {
                    u.x += (dx / dist) * 0.8;
                    u.y += (dy / dist) * 0.8;
                }
            }

            // 导弹追踪与命中
            for (let i = missiles.length - 1; i >= 0; i--) {
                let m = missiles[i];
                if (m.target && m.target.hp > 0) {
                    m.targetX = m.target.x;
                    m.targetY = m.target.y;
                }
                let dx = m.targetX - m.x;
                let dy = m.targetY - m.y;
                let dist = Math.hypot(dx, dy);

                if (dist < m.speed) {
                    m.x = m.targetX;
                    m.y = m.targetY;
                    if (m.target && m.target.hp > 0) {
                        m.target.hp -= m.damage;
                        explosions.push({ x: m.x, y: m.y, radius: 2, maxRadius: 25, alpha: 1.0 });
                        playSound('explosion');
                        if (m.target.hp <= 0) {
                            m.target.hp = 0;
                        }
                    }
                    missiles.splice(i, 1);
                } else {
                    m.x += (dx / dist) * m.speed;
                    m.y += (dy / dist) * m.speed;
                }
            }

            // 战机移动
            for (let i = aircraft.length - 1; i >= 0; i--) {
                let ac = aircraft[i];
                ac.fuel--;
                let dx = ac.targetX - ac.x;
                let dy = ac.targetY - ac.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 2) {
                    ac.x += (dx / dist) * 2;
                    ac.y += (dy / dist) * 2;
                }
                if (ac.fuel <= 0) {
                    aircraft.splice(i, 1);
                }
            }

            // 爆炸粒子动效
            for (let i = explosions.length - 1; i >= 0; i--) {
                let ex = explosions[i];
                ex.radius += 0.8;
                ex.alpha -= 0.03;
                if (ex.alpha <= 0) explosions.splice(i, 1);
            }

            runAI();

            // 计算战力百分比
            let blueTotal = units.filter(u => u.team === 'blue').reduce((acc, u) => acc + u.maxHp, 0);
            let blueCurr = units.filter(u => u.team === 'blue').reduce((acc, u) => acc + u.hp, 0);
            let redTotal = units.filter(u => u.team === 'red').reduce((acc, u) => acc + u.maxHp, 0);
            let redCurr = units.filter(u => u.team === 'red').reduce((acc, u) => acc + u.hp, 0);

            document.getElementById("blue-score").innerText = `蓝方战力: ${Math.max(0, Math.round(blueCurr/blueTotal*100))}%`;
            document.getElementById("red-score").innerText = `红方战力: ${Math.max(0, Math.round(redCurr/redTotal*100))}%`;
        }

        // 画面高级军事风格渲染
        function draw() {
            ctx.fillStyle = "#050b14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制战术网格
            ctx.strokeStyle = "#0d1b2a";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 60) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 60) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 绘制雷达扫描圈（选中目标高亮）
            if (selectedUnit && selectedUnit.hp > 0) {
                ctx.strokeStyle = "rgba(56, 189, 248, 0.3)";
                ctx.beginPath();
                ctx.arc(selectedUnit.x, selectedUnit.y, 40, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 绘制舰艇单位
            for (let u of units) {
                if (u.hp <= 0) {
                    ctx.fillStyle = "#4b5563";
                    ctx.font = "10px sans-serif";
                    ctx.fillText("[已沉没] " + u.name, u.x - 30, u.y);
                    continue;
                }

                ctx.fillStyle = (u.team === 'blue') ? "#0ea5e9" : "#ef4444";
                ctx.beginPath();
                if (u.type === 'CVN') {
                    ctx.rect(u.x - 14, u.y - 7, 28, 14);
                } else if (u.type === 'DDG') {
                    ctx.rect(u.x - 10, u.y - 5, 20, 10);
                } else {
                    ctx.arc(u.x, u.y, 6, 0, Math.PI * 2);
                }
                ctx.fill();

                // 状态血条
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(u.x - 15, u.y - 15, 30, 4);
                ctx.fillStyle = (u.team === 'blue') ? "#38bdf8" : "#f87171";
                ctx.fillRect(u.x - 15, u.y - 15, 30 * (u.hp / u.maxHp), 4);

                // 名称标签
                ctx.fillStyle = "#94a3b8";
                ctx.font = "10px sans-serif";
                ctx.fillText(`${u.name} (${u.missiles})`, u.x - 35, u.y - 20);
            }

            // 绘制飞机
            for (let ac of aircraft) {
                ctx.fillStyle = "#fbbf24";
                ctx.beginPath();
                ctx.arc(ac.x, ac.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fbbf24";
                ctx.font = "9px sans-serif";
                ctx.fillText("✈ " + ac.type, ac.x + 6, ac.y + 3);
            }

            // 绘制导弹轨迹
            for (let m of missiles) {
                ctx.strokeStyle = (m.team === 'blue') ? "#38bdf8" : "#fca5a5";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(m.x, m.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = "#fff";
                ctx.fill();
            }

            // 绘制爆炸特效
            for (let ex of explosions) {
                ctx.strokeStyle = `rgba(249, 115, 22, ${ex.alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
